name: truesee

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-truesee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truesee_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-truesee}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - truesee_pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  truesee_pgdata:
